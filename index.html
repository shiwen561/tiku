<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会计题库系统</title>
<style>
/* ========== CSS Variables & Theme ========== */
:root {
  --primary: #0F766E;
  --primary-dark: #115E59;
  --primary-light: #E6F5F2;
  --purple: #D97706;
  --purple-light: #FFF7ED;
  --bg: #F7F8F6;
  --card-bg: #FFFFFF;
  --text: #17211F;
  --text-secondary: #52605D;
  --text-muted: #8A9692;
  --border: #E3E8E5;
  --border-light: #F0F3F1;
  --success: #16A34A;
  --success-bg: #ECFDF3;
  --success-border: #B7EFC8;
  --danger: #DC2626;
  --danger-bg: #FEF2F2;
  --danger-border: #FECACA;
  --warning: #D97706;
  --warning-bg: #FFF7ED;
  --warning-border: #FED7AA;
  --radius: 8px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --shadow-sm: 0 1px 2px rgba(15, 35, 31, 0.05);
  --shadow: 0 8px 24px rgba(15, 35, 31, 0.06);
  --shadow-md: 0 12px 28px rgba(15, 35, 31, 0.08);
  --shadow-lg: 0 18px 44px rgba(15, 35, 31, 0.12);
  --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
  --sidebar-width: 208px;
  --right-panel-width: 248px;
}

/* ========== Reset & Base ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  display: flex; flex-direction: column;
  letter-spacing: 0;
}

/* ========== Top Bar ========== */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,0.96); padding: 14px 24px;
  border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm);
  position: sticky; top: 0; z-index: 20;
}
.top-bar .brand { font-size: 20px; font-weight: 800; color: var(--primary-dark); white-space: nowrap; }
.top-bar .top-stats { display: flex; gap: 10px; align-items: center; }
.top-bar .top-stat {
  min-width: 92px; padding: 8px 12px; text-align: left;
  background: #FAFBFA; border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
}
.top-bar .top-stat .num { font-size: 20px; font-weight: 800; color: var(--text); line-height: 1.1; }
.top-bar .top-stat .lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.login-btn {
  min-width: 86px; height: 40px; border-radius: var(--radius);
  border: 1px solid var(--primary); background: var(--primary);
  color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: all var(--transition); box-shadow: 0 8px 18px rgba(15,118,110,0.18);
}
.login-btn:hover { background: var(--primary-dark); border-color: var(--primary-dark); transform: translateY(-1px); }
.login-btn.logged-in {
  background: #fff; color: var(--primary-dark); border-color: var(--border);
  box-shadow: var(--shadow-sm);
}
.login-btn.logged-in:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

/* ========== App Layout ========== */
.app-layout { display: flex; flex: 1; min-height: 0; }

/* ========== Left Sidebar ========== */
.sidebar-left {
  width: var(--sidebar-width); background: #FFFFFF;
  border-right: 1px solid var(--border); display: flex;
  flex-direction: column; flex-shrink: 0; overflow-y: auto;
}
.sidebar-left .nav-menu { flex: 1; padding: 18px 10px; }
.sidebar-left .nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; cursor: pointer; font-size: 14px;
  color: var(--text-secondary); transition: all var(--transition);
  border-left: 3px solid transparent; margin: 4px 0; border-radius: var(--radius);
}
.sidebar-left .nav-item:hover { background: var(--primary-light); color: var(--primary-dark); }
.sidebar-left .nav-item.active {
  background: var(--primary-light); color: var(--primary-dark);
  border-left-color: var(--primary); font-weight: 600;
}
.sidebar-left .nav-item .nav-icon { font-size: 18px; width: 24px; text-align: center; }
.sidebar-left .nav-bottom { padding: 12px 10px; border-top: 1px solid var(--border); }
.sidebar-left .nav-bottom .nav-item {
  font-size: 13px; color: var(--text-muted);
}

/* ========== Main Content ========== */
.main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ========== Filter Bar ========== */
.filter-bar {
  display: flex; gap: 10px; padding: 14px 18px; background: rgba(255,255,255,0.92);
  border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center;
}
.filter-bar select {
  height: 38px; padding: 0 34px 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  font-size: 13px; color: var(--text-secondary); background: #FFFFFF;
  cursor: pointer; min-width: 116px; transition: all var(--transition);
}
.filter-bar select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(15,118,110,0.12); }
.filter-bar .filter-spacer { flex: 1; }

/* ========== Chapter Practice ========== */
.chapter-view {
  flex: 1; overflow-y: auto; padding: 22px; background: var(--bg);
}
.chapter-panel {
  max-width: 1080px; margin: 0 auto; background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
}
.chapter-toolbar {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  padding: 16px 18px; border-bottom: 1px solid var(--border); background: #FAFBFA;
}
.chapter-toolbar h3 {
  margin: 0; font-size: 18px; color: var(--text); flex: 1 1 220px;
}
.chapter-toolbar select {
  height: 38px; padding: 0 34px 0 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: #fff; min-width: 220px;
}
.chapter-list {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px; padding: 18px;
}
.chapter-card {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; background: #fff; min-height: 132px;
  display: flex; flex-direction: column; gap: 10px;
}
.chapter-card .chapter-name { font-weight: 700; color: var(--text); line-height: 1.35; }
.chapter-card .chapter-meta { font-size: 12px; color: var(--text-muted); }
.chapter-card .chapter-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.chapter-card .chapter-tag {
  font-size: 12px; padding: 2px 7px; border-radius: 999px;
  background: var(--primary-light); color: var(--primary-dark);
}
.chapter-card button { align-self: flex-start; }

/* ========== Question Scroll Area ========== */
.question-scroll {
  flex: 1; overflow-y: auto; padding: 22px;
  display: flex; gap: 18px; align-items: flex-start;
}

/* ========== Question Card ========== */
.q-card {
  flex: 1; background: var(--card-bg); border-radius: var(--radius);
  padding: 26px; box-shadow: var(--shadow); max-width: 860px;
  border: 1px solid var(--border);
}
.q-card .q-tags { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.q-card .q-tag {
  padding: 4px 10px; border-radius: var(--radius-xs); font-size: 12px; font-weight: 700;
}
.q-card .q-tag.t-subject { background: var(--primary-light); color: var(--primary); }
.q-card .q-tag.t-single { background: var(--purple-light); color: var(--warning); }
.q-card .q-tag.t-multi { background: var(--purple-light); color: var(--warning); }
.q-card .q-tag.t-judge { background: #D1FAE5; color: #047857; }
.q-card .q-tag.t-text { background: var(--warning-bg); color: var(--warning); }

.q-card .q-body { font-size: 16px; line-height: 1.85; color: var(--text); margin-bottom: 22px; }

/* ========== Options ========== */
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition); background: var(--card-bg);
}
.option:hover { border-color: var(--primary); background: #F5FBF9; transform: translateY(-1px); }
.option.selected { border-color: var(--primary); background: var(--primary-light); box-shadow: 0 0 0 3px rgba(15,118,110,0.10); }
.option.correct { border-color: var(--success); background: var(--success-bg); }
.option.wrong { border-color: var(--danger); background: var(--danger-bg); animation: shake 0.4s ease; }
.option .o-letter {
  width: 30px; height: 30px; border-radius: var(--radius-xs);
  background: var(--border-light); display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: var(--text-secondary); flex-shrink: 0;
  transition: all var(--transition);
}
.option.selected .o-letter { background: var(--primary); color: #fff; }
.option.correct .o-letter { background: var(--success); color: #fff; }
.option.wrong .o-letter { background: var(--danger); color: #fff; }
.option .o-text { flex: 1; font-size: 15px; }

/* ========== Answer Box ========== */
.answer-box {
  margin-top: 20px; padding: 16px; border-radius: var(--radius-sm); display: none;
}
.answer-box.show { display: block; animation: slideDown 0.3s ease; }
.answer-box.correct { background: var(--success-bg); border: 1.5px solid var(--success-border); }
.answer-box.wrong { background: var(--danger-bg); border: 1.5px solid var(--danger-border); }
.answer-box.neutral { background: var(--warning-bg); border: 1.5px solid var(--warning-border); }
.answer-box .ans-title { font-weight: 700; margin-bottom: 6px; font-size: 15px; }
.answer-box .ans-exp { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }

/* ========== Bottom Action Bar ========== */
.action-bar {
  display: flex; gap: 10px; margin-top: 24px; align-items: center;
}
.btn {
  padding: 10px 18px; border-radius: var(--radius); font-size: 14px;
  border: none; cursor: pointer; font-weight: 600; transition: all var(--transition);
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
}
.btn:active { transform: scale(0.97); }
.btn-outline {
  background: var(--card-bg); color: var(--text-secondary);
  border: 1px solid var(--border); min-width: 100px;
}
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-primary { background: var(--primary); color: #fff; min-width: 120px; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-purple { background: var(--warning); color: #fff; min-width: 120px; }
.btn-purple:hover { background: #B45309; }
.btn-success { background: var(--success); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-ai {
  background: #EAF6FF; color: #0369A1; border: 1px solid #BAE6FD;
  min-width: 112px;
}
.btn-ai:hover { background: #DFF3FF; border-color: #7DD3FC; color: #075985; }
.btn-mark {
  background: #fff; border: 1px solid var(--border); color: var(--text-muted);
  width: 42px; height: 42px; border-radius: var(--radius); font-size: 18px;
  cursor: pointer; transition: all var(--transition); display: flex;
  align-items: center; justify-content: center; flex-shrink: 0;
}
.btn-mark:hover { border-color: var(--warning); color: var(--warning); }
.btn-mark.active { border-color: var(--warning); color: var(--warning); background: var(--warning-bg); }

/* ========== Right Panel ========== */
.sidebar-right {
  width: var(--right-panel-width); background: transparent;
  border-left: none; padding: 0; flex-shrink: 0;
  overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
}
.answer-sheet {
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
}
.answer-sheet .as-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.answer-sheet .as-title { font-size: 14px; font-weight: 600; color: var(--text); }
.answer-sheet .as-clear { font-size: 12px; color: var(--text-muted); cursor: pointer; }
.answer-sheet .as-range {
  font-size: 12px; color: var(--text-muted); margin: -4px 0 10px;
}
.answer-sheet .as-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.answer-sheet .as-dot {
  width: 36px; height: 32px; border-radius: var(--radius-xs); font-size: 12px;
  cursor: pointer; border: 1px solid var(--border); background: var(--card-bg);
  color: var(--text-secondary); font-weight: 500; display: flex;
  align-items: center; justify-content: center; transition: all var(--transition);
}
.answer-sheet .as-dot:hover { border-color: var(--primary); }
.answer-sheet .as-dot.current { background: var(--primary); color: #fff; border-color: var(--primary); }
.answer-sheet .as-dot.wrong { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }
.answer-sheet .as-dot.correct { border-color: var(--success); color: var(--success); background: var(--success-bg); }
.answer-sheet .as-dot.answered:not(.correct):not(.wrong) { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
.answer-sheet .as-dot.text-type { border-color: var(--warning); }
.answer-sheet .as-pager {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  gap: 8px; margin-top: 12px;
}
.answer-sheet .as-page-btn {
  height: 32px; border-radius: var(--radius-xs); border: 1px solid var(--border);
  background: #fff; color: var(--text-secondary); cursor: pointer;
  font-size: 12px; font-weight: 700; transition: all var(--transition);
}
.answer-sheet .as-page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.answer-sheet .as-page-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.answer-sheet .as-page-info { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

/* ========== Stats Box ========== */
.stats-box {
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
}
.stats-box .sb-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
.stats-box .sb-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); margin: 4px 0; }
.stats-box .sb-row span:last-child { font-weight: 600; color: var(--text); }

/* ========== AI Explain Modal ========== */
.ai-modal-mask {
  position: fixed; inset: 0; z-index: 1200; display: none;
  align-items: center; justify-content: center; padding: 24px;
  background: rgba(15, 23, 42, 0.28);
}
.ai-modal-mask.visible { display: flex; animation: fadeIn 0.18s ease; }
.ai-modal {
  width: min(680px, 100%); max-height: min(760px, calc(100vh - 48px));
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column;
}
.ai-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px; border-bottom: 1px solid var(--border);
}
.ai-modal-title { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 800; color: var(--text); }
.ai-modal-close {
  width: 32px; height: 32px; border-radius: var(--radius-xs);
  border: 1px solid var(--border); background: #fff; color: var(--text-secondary);
  cursor: pointer; font-size: 18px; line-height: 1;
}
.ai-modal-close:hover { border-color: var(--primary); color: var(--primary); }
.ai-modal-body { padding: 18px; overflow-y: auto; }
.ai-status-chip {
  display: inline-flex; align-items: center; padding: 4px 9px;
  border-radius: var(--radius-xs); background: var(--primary-light);
  color: var(--primary-dark); font-size: 12px; font-weight: 700; margin-bottom: 14px;
}
.ai-section {
  padding: 14px 0; border-top: 1px solid var(--border-light);
}
.ai-section:first-of-type { border-top: none; padding-top: 0; }
.ai-section h4 { font-size: 14px; color: var(--text); margin-bottom: 7px; }
.ai-section p { font-size: 14px; color: var(--text-secondary); line-height: 1.75; }
.ai-loading { color: var(--text-muted); font-size: 14px; line-height: 1.8; }
.ai-error { color: var(--danger); font-size: 13px; margin-bottom: 10px; }
.ai-modal-footer {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 14px 18px; border-top: 1px solid var(--border); background: #FAFBFA;
}
.login-modal { width: min(440px, 100%); }
.login-tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin-bottom: 16px; padding: 4px; background: var(--bg); border-radius: var(--radius);
}
.login-tab {
  height: 36px; border: 0; border-radius: var(--radius-xs); cursor: pointer;
  background: transparent; color: var(--text-secondary); font-weight: 700;
}
.login-tab.active { background: #fff; color: var(--primary-dark); box-shadow: var(--shadow-sm); }
.login-form { display: flex; flex-direction: column; gap: 12px; }
.login-field label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: var(--text-secondary); }
.login-field input {
  width: 100%; height: 40px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 0 12px; font: inherit; color: var(--text); background: #fff;
}
.login-field input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(15,118,110,0.12); }
.login-help {
  font-size: 12px; color: var(--text-muted); line-height: 1.7;
  background: #FAFBFA; border: 1px solid var(--border-light); border-radius: var(--radius-sm);
  padding: 10px 12px;
}
.login-status { min-height: 20px; font-size: 13px; color: var(--text-secondary); }
.login-status.error { color: var(--danger); }
.login-status.success { color: var(--success); }
.login-config {
  margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-light);
}
.login-config-row { display: flex; gap: 8px; align-items: center; }
.login-config-row input {
  flex: 1; height: 38px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 0 10px; font: inherit;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ========== Text Answer ========== */
.text-answer {
  width: 100%; min-height: 130px; padding: 14px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-size: 15px; font-family: inherit;
  resize: vertical; line-height: 1.7; background: var(--bg); color: var(--text);
}
.text-answer:focus { border-color: var(--primary); outline: none; }

/* ========== Exam Mode ========== */
.exam-config {
  background: var(--card-bg); border-radius: var(--radius); padding: 24px;
  box-shadow: var(--shadow); border: 1px solid var(--border); margin: 24px;
}
.exam-config h3 { margin-bottom: 16px; font-size: 18px; }
.exam-config .row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.exam-config select {
  padding: 10px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
  font-size: 15px; min-width: 180px; background: var(--bg); color: var(--text); cursor: pointer;
}
.exam-config select:focus { border-color: var(--primary); outline: none; }
.exam-config .info { font-size: 13px; color: var(--text-secondary); margin: 8px 0; }
.exam-layout { display: flex; gap: 16px; padding: 0 24px; }
.exam-sidebar {
  width: 200px; background: var(--card-bg); border-radius: var(--radius);
  padding: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); flex-shrink: 0;
}
.exam-sidebar .sidebar-title { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
.exam-sidebar .q-dot {
  display: inline-block; width: 30px; height: 30px; line-height: 30px;
  text-align: center; margin: 3px; border-radius: var(--radius-sm); font-size: 12px;
  cursor: pointer; border: 1.5px solid var(--border); background: var(--card-bg);
  color: var(--text-secondary); font-weight: 500; transition: all var(--transition);
}
.exam-main { flex: 1; min-width: 0; }
.exam-sidebar .q-dot.current { background: var(--primary); color: #fff; border-color: var(--primary); }
.exam-sidebar .q-dot.answered { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.exam-sidebar .q-dot.text-type { border-color: var(--warning); }
.exam-sidebar .q-dot.text-type.answered { background: var(--warning-bg); border-color: var(--warning); color: var(--warning); }
.stats {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  padding: 18px 24px 10px;
}
.stat-chip, .timer-chip, .tag {
  display: inline-flex; align-items: center; min-height: 28px;
  padding: 5px 10px; border-radius: var(--radius-xs);
  background: var(--primary-light); color: var(--primary-dark);
  font-size: 12px; font-weight: 700;
}
.timer-chip { background: var(--warning-bg); color: var(--warning); }
.card {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px; box-shadow: var(--shadow);
}
.q-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.tag.type-single, .tag.type-multi { background: var(--purple-light); color: var(--warning); }
.tag.type-judge { background: var(--success-bg); color: var(--success); }
.tag.type-text { background: var(--warning-bg); color: var(--warning); }
.option .letter {
  width: 30px; height: 30px; border-radius: var(--radius-xs);
  background: var(--border-light); display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: var(--text-secondary); flex-shrink: 0;
}
.option.selected .letter { background: var(--primary); color: #fff; }
.option .text { flex: 1; font-size: 15px; }
.nav {
  display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;
}
.nav button {
  min-width: 110px; height: 40px; padding: 0 16px; border-radius: var(--radius);
  border: 1px solid var(--border); background: #fff; color: var(--text-secondary);
  cursor: pointer; font-weight: 700; transition: all var(--transition);
}
.nav button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.nav button:last-child {
  background: var(--primary); border-color: var(--primary); color: #fff;
}
.nav button:disabled { opacity: 0.45; cursor: not-allowed; }

.result-card {
  background: var(--card-bg); border-radius: var(--radius); padding: 32px 24px;
  box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center; margin: 24px;
}
.result-card .score { font-size: 72px; font-weight: 800; color: var(--success); line-height: 1; }
.result-card .score.fail { color: var(--danger); }
.result-card .breakdown { margin: 16px 0; font-size: 14px; color: var(--text-secondary); line-height: 1.8; }

.text-self-grade { margin: 20px 24px; text-align: left; }
.text-self-grade h4 { margin-bottom: 14px; font-size: 16px; }
.text-self-grade pre { font-family: inherit; line-height: 1.7; white-space: pre-wrap; margin: 0; }
.self-grade-btns { margin: 10px 0; display: flex; gap: 10px; }
.self-grade-btns button {
  padding: 10px 22px; border-radius: var(--radius-sm); font-size: 14px;
  border: 2px solid var(--border); cursor: pointer; background: var(--card-bg);
  font-weight: 600; transition: all var(--transition);
}
.self-grade-btns button:hover { border-color: var(--primary); }
.self-grade-btns button.graded-correct { background: var(--success); color: #fff; border-color: var(--success); }
.self-grade-btns button.graded-wrong { background: var(--danger); color: #fff; border-color: var(--danger); }

.empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty .icon { font-size: 48px; margin-bottom: 12px; }

/* ========== Animations ========== */
@keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes shake {
  0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
}
@keyframes pulse-green {
  0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
  70% { box-shadow: 0 0 0 10px rgba(34,197,94,0); }
  100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
}
@keyframes floatIn { from { opacity: 0; transform: scale(0.8) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

/* ========== Calculator ========== */
.calc-fab {
  position: fixed; bottom: 28px; right: 28px; z-index: 1000;
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--primary); color: #fff; border: none;
  font-size: 20px; cursor: pointer; box-shadow: var(--shadow-lg);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.calc-fab:hover { transform: scale(1.08); }
.calc-panel {
  position: fixed; z-index: 1001; display: none;
  width: 280px; background: var(--card-bg); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); border: 1px solid var(--border); overflow: hidden; user-select: none;
}
.calc-panel.visible { display: block; animation: floatIn 0.2s ease; }
.calc-panel.dragging { transition: none; }
.calc-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; background: var(--bg); cursor: move;
  border-bottom: 1px solid var(--border);
}
.calc-header span { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
.calc-header button { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--text-secondary); }
.calc-header button:hover { background: var(--border); padding: 2px 6px; border-radius: 4px; }
.calc-display { padding: 16px; min-height: 70px; text-align: right; background: var(--bg); }
.calc-expr { font-size: 14px; color: var(--text-secondary); min-height: 20px; word-break: break-all; }
.calc-result { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1.2; }
.calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); }
.calc-keys button {
  padding: 14px 0; border: none; font-size: 16px; cursor: pointer;
  background: var(--card-bg); color: var(--text); font-weight: 500; transition: all 0.1s ease;
}
.calc-keys button:active { background: var(--border-light); transform: scale(0.95); }
.calc-keys button.fn { color: var(--primary); font-weight: 600; background: #FAFAFA; }
.calc-keys button.op { color: var(--primary); font-weight: 700; font-size: 18px; }
.calc-keys button.eq { background: var(--primary); color: #fff; font-weight: 700; font-size: 20px; }
.calc-keys button.eq:active { background: var(--primary-dark); }
.calc-keys button.mem { color: var(--text-muted); font-size: 12px; font-weight: 600; }

/* ========== Responsive ========== */
@media (max-width: 960px) {
  .sidebar-left { display: none; }
  .sidebar-right { display: none; }
  .question-scroll { padding: 16px; }
  .q-card { max-width: 100%; }
  .top-bar { padding: 12px 16px; }
  .top-bar .top-stats { gap: 14px; }
  .top-bar .top-stat .num { font-size: 22px; }
  .top-bar .brand { font-size: 16px; }
  .top-bar .top-stat { min-width: 80px; }
}
@media (max-width: 600px) {
  .top-bar { flex-direction: column; gap: 8px; text-align: center; }
  .top-bar .top-stats { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); }
  .login-btn { width: 100%; max-width: 220px; }
  .filter-bar select { min-width: 90px; font-size: 12px; }
  .q-card { padding: 16px; }
  .action-bar { flex-wrap: wrap; }
  .btn { min-width: auto !important; flex: 1; font-size: 13px; padding: 10px 14px; }
  .exam-layout { flex-direction: column; padding: 0; }
  .exam-sidebar { width: 100%; }
}</style>

function navSwitch(tab) {
  currentMode = tab;
  document.querySelectorAll('.sidebar-left .nav-item[data-tab]').forEach(el => el.classList.remove('active'));
  const navEl = document.querySelector(`.sidebar-left .nav-item[data-tab="${tab}"]`);
  if (navEl) navEl.classList.add('active');

  const quizView = document.getElementById('quizView');
  const chapterView = document.getElementById('chapterView');
  const examView = document.getElementById('examView');
  const answerSheet = document.getElementById('answerSheet');

  if (tab === 'exam') {
    quizView.style.display = 'none';
    chapterView.style.display = 'none';
    examView.style.display = '';
    if (answerSheet) answerSheet.style.display = 'none';
    initExamConfig();
  } else if (tab === 'chapter') {
    quizView.style.display = 'none';
    chapterView.style.display = '';
    examView.style.display = 'none';
    if (answerSheet) answerSheet.style.display = 'none';
    renderChapterList();
  } else {
    quizView.style.display = '';
    chapterView.style.display = 'none';
    examView.style.display = 'none';
    if (answerSheet) answerSheet.style.display = '';
    // Set filter mode for wrong/fav
    if (tab !== 'quiz') activeChapterPractice = null;
    if (tab === 'wrong') { document.getElementById('selMode').value = 'wrong'; applyFilters(); }
    else if (tab === 'fav') { document.getElementById('selMode').value = 'fav'; applyFilters(); }
    else if (tab === 'quiz') { activeChapterPractice = null; document.getElementById('selMode').value = 'sequential'; applyFilters(); }
    // stats tab just shows quiz with stats highlight
  }
  updateTopBar();
}

// ==================== TOP BAR ====================
function updateTopBar() {
  document.getElementById('topTotal').textContent = allQuestions.length;
  const answeredCount = answeredSet.size;
  const wrongCount = wrongSet.size;
  document.getElementById('topAnswered').textContent = answeredCount;
  document.getElementById('topWrong').textContent = wrongCount;
  document.getElementById('topAccuracy').textContent = answeredCount > 0
    ? Math.round((answeredCount - wrongCount) / answeredCount * 100) + '%'
    : '--';
}

function updateAnswerSheet() {
  const grid = document.getElementById('asGrid');
  if (!grid) return;
  const total = filteredQuestions.length;
  const sheet = grid.closest('.answer-sheet');
  grid.style.gridTemplateColumns = 'repeat(5, 1fr)';

  if (total === 0) {
    answerSheetPage = 0;
    if (sheet) {
      sheet.querySelector('.as-range')?.remove();
      sheet.querySelector('.as-pager')?.remove();
    }
    grid.innerHTML = '<span style="font-size:12px;color:var(--text-muted);">暂无题目</span>';
    updateStatsPanel();
    return;
  }

  const totalPages = Math.ceil(total / ANSWER_SHEET_PAGE_SIZE);
  if (currentIndex >= 0 && !sheet?.dataset.manualPage) {
    answerSheetPage = Math.floor(currentIndex / ANSWER_SHEET_PAGE_SIZE);
  }
  answerSheetPage = Math.max(0, Math.min(answerSheetPage, totalPages - 1));

  const start = answerSheetPage * ANSWER_SHEET_PAGE_SIZE;
  const end = Math.min(start + ANSWER_SHEET_PAGE_SIZE, total);
  let html = '';
  for (let i = start; i < end; i++) {
    const q = filteredQuestions[i];
    let cls = 'as-dot';
    if (q.type && TEXT_TYPES.has(q.type)) cls += ' text-type';
    if (i === currentIndex) cls += ' current';
    const qid = q.id;
    if (wrongSet.has(qid)) cls += ' wrong';
    else if (answeredSet.has(qid)) cls += ' correct';
    html += `<span class="${cls}" onclick="goToQuestion(${i})">${i+1}</span>`;
  }
  grid.innerHTML = html;

  if (sheet) {
    let range = sheet.querySelector('.as-range');
    if (!range) {
      range = document.createElement('div');
      range.className = 'as-range';
      grid.before(range);
    }
    range.textContent = `显示 ${start + 1}-${end} / 共 ${total} 题`;

    let pager = sheet.querySelector('.as-pager');
    if (!pager) {
      pager = document.createElement('div');
      pager.className = 'as-pager';
      grid.after(pager);
    }
    pager.innerHTML = `
      <button class="as-page-btn" onclick="changeAnswerSheetPage(-1)" ${answerSheetPage === 0 ? 'disabled' : ''}>上一组</button>
      <span class="as-page-info">${answerSheetPage + 1}/${totalPages}</span>
      <button class="as-page-btn" onclick="changeAnswerSheetPage(1)" ${answerSheetPage >= totalPages - 1 ? 'disabled' : ''}>下一组</button>`;
  }
  updateStatsPanel();
}

function syncAnswerSheetToCurrentQuestion() {
  const sheet = document.getElementById('asGrid')?.closest('.answer-sheet');
  if (sheet) delete sheet.dataset.manualPage;
}

function changeAnswerSheetPage(delta) {
  const totalPages = Math.max(1, Math.ceil(filteredQuestions.length / ANSWER_SHEET_PAGE_SIZE));
  answerSheetPage = Math.max(0, Math.min(answerSheetPage + delta, totalPages - 1));
  const grid = document.getElementById('asGrid');
  const sheet = grid?.closest('.answer-sheet');
  if (sheet) sheet.dataset.manualPage = '1';
  updateAnswerSheet();
}

function updateStatsPanel() {
  const answeredInFilter = filteredQuestions.filter(q => answeredSet.has(q.id)).length;
  const wrongInFilter = filteredQuestions.filter(q => wrongSet.has(q.id)).length;
  const correctInFilter = Math.max(0, answeredInFilter - wrongInFilter);
  document.getElementById('sbAnswered').textContent = answeredInFilter;
  document.getElementById('sbCorrect').textContent = correctInFilter;
  document.getElementById('sbAccuracy').textContent = answeredInFilter > 0
    ? Math.round((correctInFilter / answeredInFilter) * 100) + '%' : '--';
}

function goToQuestion(i) {
  currentIndex = i;
  selectedOptions.clear();
  syncAnswerSheetToCurrentQuestion();
  renderQuestion(filteredQuestions[currentIndex]);
  updateAnswerSheet();
}

function clearAnswers() {
  if (!confirm('确定清空所有答题记录？（不会删除错题本数据）')) return;
  answeredSet.clear();
  practiceRecords = {};
  pendingPracticeRecords.clear();
  updateTopBar();
  updateAnswerSheet();
  scheduleCloudSync();
  if (filteredQuestions.length > 0) {
    currentIndex = -1;
    nextQuestion();
  }

function initQuizFilters() {
  const subjects = [...new Set(allQuestions.map(q => q.subject))].sort();
  const selS = document.getElementById('selSubject');
  subjects.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; selS.appendChild(o); });

  const types = [...new Set(allQuestions.map(q => q.type))].sort();
  const selT = document.getElementById('selType');
  types.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; selT.appendChild(o); });

  const years = [...new Set(allQuestions.map(q => q.year).filter(Boolean))].sort((a,b) => b-a);
  const selY = document.getElementById('selYear');
  years.forEach(y => { const o = document.createElement('option'); o.value = y; o.textContent = y + '年'; selY.appendChild(o); });

  document.getElementById('selSubject').onchange = function() { updateCategories(); applyFilters(); };
  document.getElementById('selCategory').onchange = applyFilters;
  document.getElementById('selType').onchange = applyFilters;
  document.getElementById('selYear').onchange = applyFilters;
  document.getElementById('selMode').onchange = applyFilters;
  updateCategories();
}

function updateCategories() {
  const subject = document.getElementById('selSubject').value;
  const selC = document.getElementById('selCategory');
  selC.innerHTML = '<option value="all">全部小类</option>';
  const cats = subject === 'all'
    ? [...new Set(allQuestions.map(q => q.category))]
    : [...new Set(allQuestions.filter(q => q.subject === subject).map(q => q.category))];
  cats.sort();
  cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; selC.appendChild(o); });
}

function initChapterPractice() {
  const sel = document.getElementById('chapterSubject');
  if (!sel) return;
  sel.innerHTML = '';
  Object.keys(CHAPTER_SYLLABUS)
    .filter(cat => allQuestions.some(q => q.category === cat))
    .forEach(cat => {
      const o = document.createElement('option');
      o.value = cat;
      o.textContent = EXAM_DISPLAY_NAMES[cat] || cat;
      sel.appendChild(o);
    });
  renderChapterList();
}

function getChapterItems(category) {
  return (CHAPTER_SYLLABUS[category] || []).map((item, index) => ({
    key: `${category}::${index}`,
    category,
    index,
    title: item[0],
    keywords: item[1] || [],
  }));
}

function questionMatchesChapter(q, chapter) {
  if (!q || !chapter) return false;
  if (q.chapter && String(q.chapter) === chapter.title) return true;
  const haystack = `${q.question || ''} ${q.explanation || ''} ${(q.options || []).join(' ')}`;
  return chapter.keywords.some(k => haystack.includes(k));
}

function countChapterQuestions(category, chapter) {
  return allQuestions.filter(q => q.category === category && questionMatchesChapter(q, chapter)).length;
}

function renderChapterList() {
  const sel = document.getElementById('chapterSubject');
  const list = document.getElementById('chapterList');
  if (!sel || !list) return;
  const category = sel.value || Object.keys(CHAPTER_SYLLABUS)[0];
  const chapters = getChapterItems(category);
  if (!chapters.length) {
    list.innerHTML = '<div class="empty"><div class="icon">📚</div>暂无章节配置</div>';
    return;
  }
  list.innerHTML = chapters.map(ch => {
    const count = countChapterQuestions(category, ch);
    const tags = ch.keywords.slice(0, 4).map(k => `<span class="chapter-tag">${escapeHtml(k)}</span>`).join('');
    return `<div class="chapter-card">
      <div class="chapter-name">${escapeHtml(ch.title)}</div>
      <div class="chapter-meta">${count} 道匹配题目</div>
      <div class="chapter-tags">${tags}</div>
      <button class="btn btn-primary" onclick="startChapterPractice('${ch.key}')">开始练习</button>
    </div>`;
  }).join('');
}

function startChapterPractice(chapterKey) {
  const [category, indexText] = chapterKey.split('::');
  const chapter = getChapterItems(category)[Number(indexText)];
  if (!chapter) return;
  navSwitch('quiz');
  activeChapterPractice = chapter;
  document.getElementById('selSubject').value = 'all';
  updateCategories();
  document.getElementById('selCategory').value = category;
  document.getElementById('selType').value = 'all';
  document.getElementById('selYear').value = 'all';
  document.getElementById('selMode').value = 'sequential';
  applyFilters();
}

function applyFilters() {
  const subject = document.getElementById('selSubject').value;
  const category = document.getElementById('selCategory').value;
  const type = document.getElementById('selType').value;
  const year = document.getElementById('selYear').value;
  const mode = document.getElementById('selMode').value;

  filteredQuestions = allQuestions.filter(q => {
    if (subject !== 'all' && q.subject !== subject) return false;
    if (category !== 'all' && q.category !== category) return false;
    if (type !== 'all' && q.type !== type) return false;
    if (year !== 'all' && q.year != year) return false;
    return true;
  });

  if (mode === 'wrong') filteredQuestions = filteredQuestions.filter(q => wrongSet.has(q.id));
  if (mode === 'fav') filteredQuestions = filteredQuestions.filter(q => favSet.has(q.id));
  if (activeChapterPractice) {
    filteredQuestions = filteredQuestions.filter(q => questionMatchesChapter(q, activeChapterPractice));
  }
  if (mode === 'random') filteredQuestions = [...filteredQuestions].sort(() => Math.random() - 0.5);

  currentIndex = -1;
  answerSheetPage = 0;
  syncAnswerSheetToCurrentQuestion();
  updateTopBar();
  if (filteredQuestions.length > 0) nextQuestion();
  else {
    document.getElementById('questionArea').innerHTML = '<div class="empty"><div class="icon">📭</div>没有匹配的题目</div>';
    updateAnswerSheet();
  }
}

function nextQuestion() {
  if (filteredQuestions.length === 0) {
    document.getElementById('questionArea').innerHTML = '<div class="empty"><div class="icon">🎉</div>已完成全部题目！</div>';
    return;
  }
  currentIndex = (currentIndex + 1) % filteredQuestions.length;
  selectedOptions.clear();
  lastUserAnswer = '';
  syncAnswerSheetToCurrentQuestion();
  renderQuestion(filteredQuestions[currentIndex]);
  updateAnswerSheet();
  document.getElementById('questionScroll').scrollTop = 0;
}

function renderQuestion(q) {
  const isMulti = q.type === '多选题' || q.type === '不定项选择题';
  const isTextType = TEXT_TYPES.has(q.type);
  let typeTagClass = 't-single';
  if (q.type === '多选题' || q.type === '不定项选择题') typeTagClass = 't-multi';
  else if (q.type === '判断题') typeTagClass = 't-judge';
  else if (isTextType) typeTagClass = 't-text';

  let optionsHtml = '';
  if (!isTextType) {
    if (q.type === '判断题') {
      optionsHtml += '<div class="option" onclick="selectQuizOption(this,\'正确\',\'0\')"><span class="o-letter">O</span><span class="o-text">正确</span></div>';
      optionsHtml += '<div class="option" onclick="selectQuizOption(this,\'错误\',\'0\')"><span class="o-letter">X</span><span class="o-text">错误</span></div>';
    } else {
      const labels = ['A','B','C','D','E'];
      q.options.forEach((opt,i) => {
        optionsHtml += `<div class="option" onclick="selectQuizOption(this,'${labels[i]}',${isMulti?'1':'0'})"><span class="o-letter">${labels[i]}</span><span class="o-text">${escapeHtml(opt)}</span></div>`;
      });
    }
  } else {
    optionsHtml = `<textarea class="text-answer" id="textAnswer" placeholder="请输入你的答案（计算题可使用右下角计算器辅助）"></textarea>
      <button onclick="showTextAnswer()" class="btn btn-purple" style="margin-top:10px;">提交答案</button>`;
  }

  const marked = favSet.has(q.id);
  let html = `<div class="q-tags">
    <span class="q-tag t-subject">${q.subject}</span>
    ${q.category ? `<span class="q-tag t-subject">${q.category}</span>` : ''}
    <span class="q-tag ${typeTagClass}">${q.type}</span>
    ${q.year ? `<span class="q-tag t-subject">${q.year}年</span>` : ''}
  </div>
  <div class="q-body">${formatQuestionText(q)}</div>
  <div class="options">${optionsHtml}</div>`;
  if (!isTextType) {
    html += `<div class="answer-box" id="answerBox"><div class="ans-title" id="resultText"></div><div class="ans-exp" id="expText"></div></div>
      <div class="action-bar">
        <button class="btn btn-outline" onclick="prevQuestion()">上一题</button>
        <button class="btn btn-purple" onclick="checkAnswer('${q.answer}',${isMulti?'1':'0'})">提交答案</button>
        <button class="btn btn-ai" onclick="openAiExplainModal()">AI 解疑</button>
        <button class="btn btn-primary" onclick="nextQuestion()">下一题</button>
        <button class="btn-mark${marked?' active':''}" id="btnMark" onclick="toggleFavorite(${q.id})" title="${marked?'取消收藏':'收藏'}">${marked?'★':'☆'}</button>
      </div>`;
  } else {
    html += `<div class="answer-box" id="answerBox"><div class="ans-title" id="resultText"></div><div class="ans-exp" id="expText"></div></div>
      <div class="action-bar">
        <button class="btn btn-outline" onclick="prevQuestion()">上一题</button>
        <button class="btn btn-ai" onclick="openAiExplainModal()">AI 解疑</button>
        <button class="btn btn-primary" onclick="nextQuestion()">下一题</button>

}

function selectQuizOption(el, label, isMultiFlag) {
  const box = document.getElementById('answerBox');
  if (box && box.classList.contains('show')) return;
  const isMulti = isMultiFlag === '1';
  if (!isMulti) { document.querySelectorAll('.option').forEach(o => o.classList.remove('selected')); selectedOptions.clear(); }
  el.classList.toggle('selected');
  el.classList.contains('selected') ? selectedOptions.add(label) : selectedOptions.delete(label);
  lastUserAnswer = [...selectedOptions].sort().join('');
}

function checkAnswer(correctAnswer, isMultiFlag) {
  const isMulti = isMultiFlag === '1';
  if (selectedOptions.size === 0) return;
  const userAnswer = [...selectedOptions].sort().join('');
  lastUserAnswer = userAnswer;
  const correct = correctAnswer.toUpperCase();
  const isCorrect = userAnswer === correct;
  document.querySelectorAll('.option').forEach(opt => {
    const letter = opt.querySelector('.o-letter').textContent;
    if (correct.includes(letter)) opt.classList.add('correct');
    if (selectedOptions.has(letter) && !correct.includes(letter)) opt.classList.add('wrong');
  });
  const box = document.getElementById('answerBox');
  box.classList.add('show', isCorrect ? 'correct' : 'wrong');
  document.getElementById('resultText').textContent = isCorrect ? '✅ 回答正确！' : `❌ 回答错误！正确答案: ${correct}`;
  document.getElementById('expText').textContent = filteredQuestions[currentIndex].explanation ? '解析: ' + filteredQuestions[currentIndex].explanation : '';
  answeredSet.add(filteredQuestions[currentIndex].id);
  if (!isCorrect) wrongSet.add(filteredQuestions[currentIndex].id);
  recordPracticeAnswer(filteredQuestions[currentIndex], userAnswer, isCorrect);
  updateTopBar();
  updateAnswerSheet();
  scheduleCloudSync();
}

function showTextAnswer() {

function buildLocalAiExplanation(q, regenerate = false) {
  const answer = String(q.answer || '暂无').toUpperCase();
  const userAnswer = lastUserAnswer || getCurrentSelectedAnswer() || '未作答';
  const userAnswerText = getAnswerDisplayText(q, userAnswer);
  const correctAnswerText = getAnswerDisplayText(q, answer);
  const explanation = q.explanation || '这道题暂时没有原始解析，后续接入大模型后可根据题干和答案生成更完整的讲解。';
  const focus = q.category || q.subject || '本题考点';
  const variantText = regenerate ? '这次换一种角度看：' : '';

  return `
    <div class="ai-section">
      <h4>为什么选错</h4>
      <p>${variantText}你的答案是 <strong>${escapeHtml(userAnswerText)}</strong>，正确答案是 <strong>${escapeHtml(correctAnswerText)}</strong>。如果两者不一致，通常说明题干中的限制条件、会计处理时点或关键词没有抓准。</p>
    </div>
    <div class="ai-section">
      <h4>正确思路</h4>
      <p>先判断题目问的是确认、计量、列报还是处理分录，再回到题干找触发条件。对于选择题，优先排除与题干条件明显冲突的选项，再对照正确答案。</p>
    </div>
    <div class="ai-section">
      <h4>考点拆解</h4>
      <p>本题关联 <strong>${escapeHtml(focus)}</strong>。原解析提示：${escapeHtml(explanation)}</p>
    </div>
    <div class="ai-section">
      <h4>记忆提醒</h4>
      <p>做这类题时先圈出“时间点、责任归属、是否满足确认条件、金额是否可靠”这几个词，再判断选项。不要只看选项熟不熟，要看它是否完全匹配题干。</p>
    </div>`;
}

function getCurrentSelectedAnswer() {
  const textAnswer = document.getElementById('textAnswer');
  if (textAnswer && textAnswer.value.trim()) return textAnswer.value.trim();
  return [...selectedOptions].sort().join('');
}

function getAnswerDisplayText(q, answer) {
  if (!answer || answer === '未作答') return '未作答';
  if (q.type === '判断题') return answer;
  if (TEXT_TYPES.has(q.type)) return answer;
  const labels = ['A','B','C','D','E'];
  const parts = String(answer).split('').map(label => {
    const idx = labels.indexOf(label);
    return idx >= 0 && q.options && q.options[idx] ? `${label}. ${q.options[idx]}` : label;
  });
  return parts.join('；');
}

function recordPracticeAnswer(q, userAnswer, isCorrect) {
  if (!q || !q.id) return;
  practiceRecords[q.id] = {
    id: q.id,
    subject: q.subject,
    category: q.category,
    type: q.type,
    year: q.year,
    question: trimForAi(q.question, 180),
    answer: trimForAi(q.answer, 120),
    userAnswer: trimForAi(userAnswer || '未作答', 160),
    isCorrect,
    answeredAt: Date.now(),
  };
  pendingPracticeRecords.set(`${q.id}:${practiceRecords[q.id].answeredAt}`, practiceRecords[q.id]);
}

function compactQuestionPayload(q) {
  const isTextType = TEXT_TYPES.has(q.type);
  return {
    id: q.id,
    subject: q.subject,
    category: q.category,
    type: q.type,
    year: q.year,
    question: trimForAi(q.question, isTextType ? 1200 : 800),
    options: Array.isArray(q.options) ? q.options.slice(0, 5).map(opt => trimForAi(opt, 140)) : [],
    answer: trimForAi(q.answer, 220),
    explanation: trimForAi(q.explanation, 400),
    isTextType,
  };
}

async function callAiProxy(path, payload) {
  const res = await fetch(`${AI_PROXY_BASE}${path}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `AI proxy ${res.status}`);
  return data;
}

function getAiCacheKey(kind, id, extra = '') {
  return `aiCache:${kind}:${id}:${simpleHash(String(extra))}`;
}

function getAiCache(key) {
  try {
    const item = JSON.parse(localStorage.getItem(key) || 'null');
    if (!item || !item.content) return '';
    if (Date.now() - item.time > 7 * 24 * 60 * 60 * 1000) return '';
    return item.content;
  } catch(e) {
    return '';
  }
}

function setAiCache(key, content) {
  try { localStorage.setItem(key, JSON.stringify({ content, time: Date.now() })); } catch(e) {}
}

function simpleHash(text) {
  let hash = 0;
  for (let i = 0; i < text.length; i++) hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
  return String(Math.abs(hash));
}

function trimForAi(value, max) {
  const text = String(value || '').replace(/\s+/g, ' ').trim();
  return text.length > max ? text.slice(0, max) + '...' : text;
}

function renderAiText(text) {
  const raw = String(text || '').trim();
  if (!raw) return '<div class="ai-section"><p>暂无内容。</p></div>';
  const sections = raw.split(/\n(?=\s*(?:错因|正确思路|考点|记忆提醒|整体评价|薄弱点|复习建议|下一步练习计划)[:：])/).filter(Boolean);
  if (sections.length > 1) {
    return sections.map(section => {
      const m = section.match(/^\s*([^:：\n]+)[:：]\s*([\s\S]*)$/);
      if (!m) return `<div class="ai-section"><p>${escapeHtml(section)}</p></div>`;
      return `<div class="ai-section"><h4>${escapeHtml(m[1].trim())}</h4><p>${escapeHtml(m[2].trim())}</p></div>`;
    }).join('');
  }
  return `<div class="ai-section"><p>${escapeHtml(raw)}</p></div>`;
}

function buildPracticeReportPayload(sourceResults = null, scopeLabel = '') {
  const records = sourceResults
    ? sourceResults.map(r => ({
        id: r.id,
        subject: r.subject,
        category: r.category,
        type: r.type,
        year: r.year,
        question: trimForAi(r.question, 180),
        answer: trimForAi(r.answer, 120),
        userAnswer: trimForAi(r.userAns || r.userAnswer || '未作答', 160),
        isCorrect: r.isCorrect,
      }))
    : filteredQuestions
        .filter(q => answeredSet.has(q.id) || practiceRecords[q.id])
        .map(q => practiceRecords[q.id] || {
          id: q.id,
          subject: q.subject,
          category: q.category,
          type: q.type,
          year: q.year,
          question: trimForAi(q.question, 180),
          answer: trimForAi(q.answer, 120),
          userAnswer: '未记录',
          isCorrect: wrongSet.has(q.id) ? false : true,
        });
  const answered = records.length;
  const wrongRecords = records.filter(r => r.isCorrect === false);
  const correct = records.filter(r => r.isCorrect === true).length;
  const wrongByType = countBy(wrongRecords, 'type');
  const wrongByCategory = countBy(wrongRecords, 'category');
  const scope = scopeLabel || getPracticeScopeLabel();
  return {
    userMode: getUserMode(),
    stats: {
      scope,
      userMode: getUserMode(),
      total: sourceResults ? sourceResults.length : filteredQuestions.length,
      answered,
      correct,
      wrong: wrongRecords.length,
      accuracy: answered ? Math.round((correct / answered) * 100) + '%' : '--',
      wrongByType,
      wrongByCategory,
    },
    wrongSamples: wrongRecords.slice(0, 8).map(r => ({
      type: r.type,
      category: r.category,
      question: r.question,
      userAnswer: r.userAnswer,
      answer: r.answer,
    })),
  };
}

function countBy(rows, key) {
  return rows.reduce((acc, row) => {
    const name = row[key] || '未分类';
    acc[name] = (acc[name] || 0) + 1;
    return acc;
  }, {});
}

function getPracticeScopeLabel() {
  const subject = document.getElementById('selSubject')?.value || 'all';
  const category = document.getElementById('selCategory')?.value || 'all';
  const type = document.getElementById('selType')?.value || 'all';
  const year = document.getElementById('selYear')?.value || 'all';
  return [
    subject === 'all' ? '全部考试' : subject,
    category === 'all' ? '全部小类' : category,
    type === 'all' ? '全部题型' : type,
    year === 'all' ? '全部年份' : `${year}年`,
  ].join(' / ');
}

function buildLocalPracticeReport(payload) {
  const s = payload.stats;
  const weakTypes = Object.keys(s.wrongByType || {}).join('、') || '暂无明显错题题型';
  const weakCats = Object.keys(s.wrongByCategory || {}).join('、') || '暂无明显薄弱科目';
  return `
    <div class="ai-section"><h4>整体评价</h4><p>本轮已答 ${s.answered} 题，正确率 ${s.accuracy}。继续保持稳定练习节奏。</p></div>
    <div class="ai-section"><h4>薄弱点</h4><p>错题主要集中在 ${escapeHtml(weakTypes)}，涉及 ${escapeHtml(weakCats)}。</p></div>
    <div class="ai-section"><h4>复习建议</h4><p>先回看错题题干关键词和原解析，再按同题型连续练习 10-20 题。</p></div>
    <div class="ai-section"><h4>下一步练习计划</h4><p>建议优先刷错题本，再进入章节练习补薄弱知识点。</p></div>`;
}

async function submitAuthForm(event) {
  event.preventDefault();
  const email = document.getElementById('authEmail')?.value.trim();
  const password = document.getElementById('authPassword')?.value || '';
  const nickname = document.getElementById('authNickname')?.value.trim();
  const registerCode = document.getElementById('authRegisterCode')?.value.trim();
  if (!email || !password) return setLoginStatus('请输入邮箱和密码。', 'error');
  if (!isValidEmail(email)) return setLoginStatus('邮箱格式不正确，请检查后重试。', 'error');
  if (password.length < 6) return setLoginStatus('密码至少 6 位。', 'error');
  try {
    setAuthBusy(true, authMode === 'register' ? '注册中...' : '登录中...');
    await ensureCloudbaseReady();
    if (authMode === 'register') {
      if (!registerCode) return setLoginStatus('请输入邮箱验证码。', 'error');
      await registerWithEmailCode(email, password, registerCode, nickname);
      await loginWithEmailPassword(email, password);
      await refreshCurrentUser(nickname || email);
      switchLearningScope(getCurrentUserLearningScope());
      updateLoginButton();
      await saveUserProfile(nickname || email, email).catch(error => console.warn('Save profile failed', error));
      registerVerificationInfo = null;
      setLoginStatus('注册成功，正在同步本地学习记录...', 'success');
    } else {
      await loginWithEmailPassword(email, password);
      await refreshCurrentUser();
      switchLearningScope(getCurrentUserLearningScope());
      updateLoginButton();
      setLoginStatus('登录成功，正在同步本地学习记录...', 'success');
    }
    const synced = await safeSyncLearningStateAfterLogin();
    if (allQuestions.length && document.getElementById('selMode')) applyFilters();
    else {
      updateTopBar();
      updateAnswerSheet();
    }
    setLoginStatus(synced ? '已切换到账号学习记录，同步完成。' : '已切换到账号学习记录，但云端学习数据暂不可用，当前先使用本机账号记录。', synced ? 'success' : '');
  } catch (error) {
    setLoginStatus(getReadableAuthError(error), 'error');
  } finally {
    setAuthBusy(false);
  }
}

async function sendRegisterCode() {
  const email = document.getElementById('authEmail')?.value.trim();
  if (!email) return setLoginStatus('请先填写邮箱。', 'error');
  if (!isValidEmail(email)) return setLoginStatus('邮箱格式不正确，请检查后重试。', 'error');
  try {
    const btn = document.getElementById('sendCodeBtn');
    if (btn) { btn.disabled = true; btn.textContent = '发送中...'; }
    await ensureCloudbaseReady();
    registerVerificationInfo = normalizeCloudbaseResult(await sendEmailVerification(email));
    if (registerVerificationInfo && registerVerificationInfo.is_user) {
      setLoginStatus('这个邮箱已经注册过，请切换到登录页直接登录。', 'error');
      return;
    }
    setLoginStatus('验证码已发送，请查看邮箱后继续注册。', 'success');
  } catch (error) {
    setLoginStatus(getReadableAuthError(error), 'error');
  } finally {
    const btn = document.getElementById('sendCodeBtn');
    if (btn) { btn.disabled = false; btn.textContent = '发送验证码'; }
  }
}

async function ensureCloudbaseReady() {
  if (!CLOUDBASE_CONFIG.env) throw new Error('missing-env');
  if (cloudbaseApp && cloudbaseAuth && cloudbaseDb) return;
  if (!cloudbaseReadyPromise) {
    cloudbaseReadyPromise = (async () => {
      await loadCloudbaseSdk();
      const sdk = window.cloudbase || window.tcb;
      if (!sdk || !sdk.init) throw new Error('sdk-not-loaded');
      cloudbaseApp = sdk.init({ env: CLOUDBASE_CONFIG.env, region: CLOUDBASE_CONFIG.region || undefined });
      cloudbaseAuth = cloudbaseApp.auth({ persistence: 'local' });
      cloudbaseDb = cloudbaseApp.database();
    })();
  }
  await cloudbaseReadyPromise;
}

function loadCloudbaseSdk() {
  if (window.cloudbase || window.tcb) return Promise.resolve();
  if (window.__cloudbaseEsmLoading) return window.__cloudbaseEsmLoading;
  const esmUrls = [
    'https://esm.sh/@cloudbase/js-sdk@3.4.5?bundle',
    'https://cdn.jsdelivr.net/npm/@cloudbase/js-sdk@3.4.5/+esm',
  ];
  window.__cloudbaseEsmLoading = esmUrls.reduce((chain, url) => {
    return chain.catch(() => import(url).then(mod => {
      window.cloudbase = mod.default || mod.cloudbase || mod;
    }));
  }, Promise.reject()).catch(() => loadLegacyCloudbaseSdk());
  return window.__cloudbaseEsmLoading;
}

function loadLegacyCloudbaseSdk() {
  const urls = [
    'https://static.cloudbase.net/cloudbase-js-sdk/2.10.3/cloudbase.full.js',
    'https://imgcache.qq.com/qcloud/cloudbase-js-sdk/2.10.3/cloudbase.full.js',
    'https://imgcache.qq.com/qcloud/tcbjs/1.10.10/tcb.js',
  ];
  return new Promise((resolve, reject) => {
    let index = 0;
    const tryNext = () => {
      if (index >= urls.length) return reject(new Error('sdk-not-loaded'));
      const script = document.createElement('script');
      script.src = urls[index++];
      script.async = true;
      script.onload = () => resolve();
      script.onerror = tryNext;
      document.head.appendChild(script);
    };
    tryNext();
  });
}

async function registerWithEmailCode(email, password, code, nickname = '') {

async function mergeCloudLearningState() {
  if (!currentUser || !cloudbaseDb) return;
  let cloudData = null;
  try {
    const res = await cloudbaseDb.collection('learning_state').doc(currentUser.uid).get();
    cloudData = Array.isArray(res.data) ? res.data[0] : res.data;
  } catch(e) {
    if (isCloudCollectionMissingError(e) || isCloudPermissionError(e)) {
      saveLocalLearningState();
      return false;
    }
    console.warn('Merge cloud learning state failed', e);
    saveLocalLearningState();
    return false;
  }
  if (!cloudData) {
    saveLocalLearningState();
    return true;
  }
  wrongSet = mergeSet(wrongSet, cloudData.wrongIds);
  favSet = mergeSet(favSet, cloudData.favIds);
  answeredSet = mergeSet(answeredSet, cloudData.answeredIds);
  practiceRecords = mergePracticeRecords(practiceRecords, cloudData.practiceRecords);
  saveLocalLearningState();
  return true;
}

function mergeSet(baseSet, values) {
  const merged = new Set(baseSet || []);
  (Array.isArray(values) ? values : []).forEach(v => merged.add(v));
  return merged;
}

function mergePracticeRecords(localRecords, cloudRecords) {
  const merged = Object.assign({}, cloudRecords || {}, localRecords || {});
  Object.keys(merged).forEach(id => {
    if (!merged[id]) delete merged[id];
  });
  return merged;
}

async function pushLearningStateToCloud() {
  if (!currentUser || !cloudbaseDb || cloudSyncing) return false;
  cloudSyncing = true;
  try {
    const state = {
      userId: currentUser.uid,
      wrongIds: [...wrongSet],
      favIds: [...favSet],
      answeredIds: [...answeredSet],
      answeredCount: answeredSet.size,
      wrongCount: wrongSet.size,
      practiceRecords,
      schemaVersion: 1,
      updatedAt: Date.now(),
    };
    await upsertCloudDoc('learning_state', currentUser.uid, state);
    const pending = [...pendingPracticeRecords.values()];
    await Promise.all(pending.slice(-20).map(record => {
      const docId = `${currentUser.uid}_${record.id}_${record.answeredAt || Date.now()}`;
      return upsertCloudDoc('practice_records', docId, Object.assign({ userId: currentUser.uid }, record, { updatedAt: Date.now() }));
    }));
    pendingPracticeRecords.clear();
    return true;
  } catch (error) {
    console.warn('Push learning state failed', error);
    if (isCloudCollectionMissingError(error) || isCloudPermissionError(error)) return false;
    return false;
  } finally {
    cloudSyncing = false;
  }
}

async function upsertCloudDoc(collectionName, docId, data) {
  const ref = cloudbaseDb.collection(collectionName).doc(String(docId));
  try {
    await ref.update(data);
  } catch (error) {
    await ref.set(data);
  }
}

      <select id="examCat" onchange="updateExamInfo()"><option value="">-- 选择科目 --</option>`;

  html += `</select>
      <select id="examYear" onchange="updateExamInfo()"><option value="">-- 选择年份 --</option>`;
  years.forEach(y => { html += `<option value="${y}">${y}年</option>`; });
  html += `</select></div>
    <div class="info" id="examInfo"></div>
    <button onclick="startExam()" class="btn btn-success" id="examStartBtn" disabled style="padding:12px 32px;font-size:16px;margin-top:8px;">开始考试</button></div>`;

function updateExamInfo() {
  const cat = document.getElementById('examCat').value;
  const year = document.getElementById('examYear').value;
  const info = document.getElementById('examInfo');
  const btn = document.getElementById('examStartBtn');

  if (!cat || !year) { info.textContent = ''; btn.disabled = true; return; }

  const spec = EXAM_SPECS[cat];
  const pool = allQuestions.filter(q => q.category === cat && q.year == year);
  const allCatPool = allQuestions.filter(q => q.category === cat);
  const types = {};
  pool.forEach(q => { types[q.type] = (types[q.type]||0) + 1; });
  const allTypes = {};
  allCatPool.forEach(q => { allTypes[q.type] = (allTypes[q.type]||0) + 1; });

  if (pool.length === 0) { info.textContent = '该科目+年份没有可用题目'; btn.disabled = true; return; }

  if (!spec) { info.textContent = '该科目暂未配置考试规则'; btn.disabled = true; return; }

  const rows = spec.map(item => {
    const sameYear = types[item.type] || 0;
    const totalAvailable = allTypes[item.type] || 0;
    const ok = totalAvailable >= item.count;
    return `${item.label}${sameYear}/${item.count}${sameYear < item.count ? `（同科可补${Math.max(0, totalAvailable - sameYear)}）` : ''}${ok ? '' : ' 不足'}`;
  });
  const canBuild = spec.every(item => (allTypes[item.type] || 0) > 0);
  const fullSameYear = spec.every(item => (types[item.type] || 0) >= item.count);
  info.innerHTML = `题库: ${rows.join('，')}<br>
    ${fullSameYear ? '✅ 可按本年份组成100分完整试卷' : '⚠ 当前年份题型不足，将从同科其他年份补题并保持100分'}`;
  btn.disabled = !canBuild;
}

function startExam() {
  const cat = document.getElementById('examCat').value;
  const year = document.getElementById('examYear').value;

  examQuestions = [];
  examQuestions = buildExamQuestions(cat, Number(year));

  if (examQuestions.length === 0) {
    alert('该科目题库不足，暂时无法组卷。');
    return;
  }

  examAnswers = {};
  examCurrentIdx = 0;
  examSubmitted = false;
  examSeconds = 0;

  document.getElementById('examView').dataset.state = 'started';
  document.getElementById('examView').dataset.total = '100';

  if (examTimer) clearInterval(examTimer);
  examTimer = setInterval(() => { examSeconds++; updateExamTimer(); }, 1000);

  renderExamQuestion();
}

function buildExamQuestions(cat, year) {
  const spec = EXAM_SPECS[cat];
  if (!spec) return [];

  const chosenIds = new Set();
  const result = [];

  spec.forEach(item => {
    const sameYear = allQuestions.filter(q => q.category === cat && q.year == year && q.type === item.type);
    const otherYears = allQuestions.filter(q => q.category === cat && q.year != year && q.type === item.type);
    const candidates = [...sameYear, ...otherYears];
    const points = Array.isArray(item.points)
      ? item.points.slice(0, item.count)
      : Array.from({ length: item.count }, () => item.points);

    let taken = 0;
    for (const q of candidates) {
      if (taken >= item.count) break;
      if (chosenIds.has(q.id)) continue;
      chosenIds.add(q.id);
      result.push({
        ...q,
        point: points[taken] ?? points[points.length - 1] ?? item.points,
        examTypeLabel: item.label,
        fromFallbackYear: q.year != year,
      });
      taken++;
    }
  });

  normalizeExamTotal(result);
  return result;
}

function normalizeExamTotal(questions) {
  const total = questions.reduce((s, q) => s + Number(q.point || 0), 0);
  if (!questions.length || Math.abs(total - 100) < 0.001) return;

  const scale = 100 / total;
  questions.forEach(q => {
    q.point = Math.max(0.5, Math.round(Number(q.point || 0) * scale * 2) / 2);
  });

  let adjusted = questions.reduce((s, q) => s + Number(q.point || 0), 0);
  let i = 0;
  while (Math.abs(adjusted - 100) >= 0.001 && questions.length && i < 1000) {
    const q = questions[i % questions.length];
    const step = adjusted < 100 ? 0.5 : -0.5;
    if (q.point + step >= 0.5) {
      q.point = Math.round((q.point + step) * 2) / 2;
      adjusted = Math.round((adjusted + step) * 2) / 2;
    }
    i++;
  }
}

function formatScore(score) {
  const n = Number(score || 0);
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}
